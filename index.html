<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Royale - Login & Register</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: #131c2e;
            --bg-input: #1a263d;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --accent-glow: rgba(245, 158, 11, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #22344f;
            --error: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.05) 0%, transparent 40%);
            padding: 1rem;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(245, 158, 11, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* Top Glow Bar */
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #d97706, #f59e0b, #fbbf24);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Toggle Tabs */
        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--bg-dark);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--bg-input);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Forms */
        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            color: var(--text-main);
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .bonus-highlight {
            border-color: rgba(245, 158, 11, 0.4);
            background: rgba(245, 158, 11, 0.03);
        }

        .bonus-hint {
            font-size: 0.75rem;
            color: var(--accent);
            margin-top: 0.35rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #090d16;
            border: none;
            padding: 0.95rem;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: filter 0.2s, transform 0.1s;
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .submit-btn:hover {
            filter: brightness(1.1);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .form-footer-msg {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.85rem;
            min-height: 1.2rem;
        }

        .msg-error { color: var(--error); }
        .msg-success { color: var(--success); font-weight: 600; }

        /* Terms / Footer note */
        .terms {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-logo">Neon Royale</div>
            <div class="brand-subtitle">Enter the ultimate gaming arena</div>
        </div>

        <!-- Navigation Tabs -->
        <div class="auth-tabs">
            <button class="tab-btn active" id="login-tab" onclick="switchView('login')">Sign In</button>
            <button class="tab-btn" id="register-tab" onclick="switchView('register')">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <div id="login-panel" class="form-panel active">
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Email or Username</label>
                    <input type="text" id="login-user" required placeholder="player@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-pass" required placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
                <div class="form-footer-msg" id="login-msg"></div>
            </form>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-panel" class="form-panel">
            <form onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="reg-user" required placeholder="Choose a username">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" required placeholder="player@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="reg-pass" required placeholder="Create a strong password">
                </div>
                <div class="input-group">
                    <label>Bonus Code (Optional)</label>
                    <input type="text" id="reg-code" class="bonus-highlight" placeholder="e.g. MRBEAST">
                    <div class="bonus-hint">✨ Enter code for instant $3,200 bonus balance credit</div>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
                <div class="form-footer-msg" id="reg-msg"></div>
            </form>
        </div>

        <div class="terms">
            By signing up, you verify that you are of legal age and agree to our Virtual Terms of Service. Simulator points hold no cash value.
        </div>
    </div>

    <script>
        function switchView(view) {
            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');
            const loginPanel = document.getElementById('login-panel');
            const registerPanel = document.getElementById('register-panel');

            if (view === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginPanel.classList.add('active');
                registerPanel.classList.remove('active');
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                registerPanel.classList.add('active');
                loginPanel.classList.remove('active');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('login-user').value;
            const msg = document.getElementById('login-msg');
            
            msg.className = 'form-footer-msg msg-success';
            msg.textContent = `Welcome back, ${user}! Loading dashboard...`;
            
            setTimeout(() => {
                // Simulation redirect or state completion
            }, 1200);
        }

        function handleRegister(e) {
            e.preventDefault();
            const user = document.getElementById('reg-user').value;
            const code = document.getElementById('reg-code').value.trim().toUpperCase();
            const msg = document.getElementById('reg-msg');

            let startingBalance = 1000; // Standard balance

            if (code === 'MRBEAST') {
                startingBalance = 3200;
                msg.className = 'form-footer-msg msg-success';
                msg.textContent = `Success! MRBEAST code applied: $3,200 bonus credited!`;
            } else if (code !== '') {
                msg.className = 'form-footer-msg msg-error';
                msg.textContent = `Invalid bonus code entered. Account created with standard balance.`;
            } else {
                msg.className = 'form-footer-msg msg-success';
                msg.textContent = `Account created successfully for ${user}!`;
            }

            setTimeout(() => {
                // Simulation transition
            }, 1500);
        }
    </script>
</body>
</html>
