<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Z4 Miner - Sign Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#020617,#0f172a,#020617);
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.container{width:100%;max-width:420px;padding:20px;}
.card{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px);
  border-radius:24px;
  padding:28px;
  box-shadow:0 25px 60px rgba(0,0,0,.6);
}
.logo{text-align:center;margin-bottom:10px;}
.logo h1{color:#facc15;font-weight:800;letter-spacing:2px;}
.logo span{color:#38bdf8;}
.title{font-size:24px;font-weight:700;margin-bottom:14px;}
.group{margin-bottom:12px;}
.group label{font-size:12px;opacity:.8;}
.input,.select{
  width:100%;padding:13px;margin-top:6px;border-radius:14px;border:none;outline:none;
  background:rgba(255,255,255,0.08);color:#fff;font-size:14px;
}
.row{display:flex;gap:10px;}
.btn{
  width:100%;padding:15px;border:none;border-radius:16px;margin-top:14px;
  background:linear-gradient(135deg,#38bdf8,#facc15);font-size:16px;font-weight:800;color:#000;cursor:pointer;
}
.footer{text-align:center;margin-top:14px;font-size:13px;opacity:.8;}
.footer a{color:#38bdf8;text-decoration:none;font-weight:600;}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="logo"><h1>Z4 <span>Miner</span></h1></div>
    <div class="title">Create Account</div>

    <div class="group">
      <label>Username</label>
      <input class="input" id="username">
    </div>

    <div class="group">
      <label>Mobile phone</label>
      <div class="row">
        <select class="select" id="country">
          <option value="+961">🇱🇧 Lebanon (+961)</option>
          <option value="+963">🇸🇾 Syria (+963)</option>
          <option value="+20">🇪🇬 Egypt (+20)</option>
          <option value="+966">🇸🇦 Saudi (+966)</option>
          <option value="+971">🇦🇪 UAE (+971)</option>
          <option value="+964">🇮🇶 Iraq (+964)</option>
          <option value="+962">🇯🇴 Jordan (+962)</option>
          <option value="+970">🇵🇸 Palestine (+970)</option>
          <option value="+90">🇹🇷 Turkey (+90)</option>
          <option value="+49">🇩🇪 Germany (+49)</option>
        </select>
        <input class="input" id="phone" placeholder="Phone number">
      </div>
    </div>

    <div class="group">
      <label>Invitation code (optional)</label>
      <input class="input" id="invite">
    </div>

    <div class="group">
      <label>Password</label>
      <input class="input" id="password" type="password">
    </div>

    <div class="group">
      <label>Confirm password</label>
      <input class="input" id="confirm" type="password">
    </div>

    <button class="btn" onclick="signup()">Create Account</button>

    <div class="footer">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDGo2POhmLnPrAwzh1Bq1VgXvYoVSmQiHU",
  authDomain: "z4-miner.firebaseapp.com",
  projectId: "z4-miner",
  storageBucket: "z4-miner.firebasestorage.app",
  messagingSenderId: "31334000454",
  appId: "1:31334000454:web:3f61ded1c258eed5c46747"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function signup(){
  const username = document.getElementById("username").value.trim();
  const phone = document.getElementById("country").value + document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  const invite = document.getElementById("invite").value.trim();

  if(!username || !password || !confirm || phone.length < 6){
    alert("Fill all fields");
    return;
  }
  if(password !== confirm){
    alert("Passwords do not match");
    return;
  }

  const email = phone + "@z4miner.com";

  auth.createUserWithEmailAndPassword(email, password)
  .then((cred)=>{
    return db.collection("users").doc(cred.user.uid).set({
      // Basic
      username: username,
      phone: phone,
      invite: invite || "",

      // Balances
      balance: 0,
      availableBalance: 0,
      lockedBalance: 0,

      // Personal profit
      dailyProfit: 0,
      totalProfit: 0,

      // Team
      teamSize: 0,
      teamDailyProfit: 0,
      teamTotalProfit: 0,

      // Plan / Mining
      level: 0,        // no plan yet
      miningPower: 0,
      dailyRate: 0,    // will be set when buying plan

      // System
      lastMiningTime: Date.now(),
      depositAddress: ""
    });
  })
  .then(()=>{
    alert("Account created successfully!");
    window.location.href = "login.html";
  })
  .catch((e)=>{
    alert(e.message);
  });
}
</script>

</body>
</html>
