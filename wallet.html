<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Z4 Miner - Wallet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:radial-gradient(circle at top,#0f172a,#020617);color:#fff;}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:120px;}

.header{padding:18px;display:flex;justify-content:space-between;align-items:center;}
.header h2{font-weight:800;}

/* Balance Cards */
.balances{
  margin:0 16px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
}
.balance-box{
  background:linear-gradient(135deg,#0b1220,#020617);
  border-radius:18px;
  padding:14px;
  text-align:center;
}
.balance-box span{font-size:11px;opacity:.7;}
.balance-box h3{margin-top:6px;color:#facc15;}

/* Card */
.card{
  margin:16px;
  background:linear-gradient(135deg,#0b1220,#020617);
  border-radius:22px;
  padding:16px;
}

/* Inputs */
.input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.06);
  color:#fff;
  margin-top:10px;
}

/* Buttons */
.btn{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:999px;
  font-weight:800;
  background:linear-gradient(135deg,#38bdf8,#facc15);
  color:#000;
}

/* Copy */
.copy-btn{
  margin-top:10px;
  background:#020617;
  color:#facc15;
  border:none;
  padding:8px 14px;
  border-radius:10px;
}

/* Bottom Nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:80px;
  background:linear-gradient(180deg,#0b1220,#020617);
  display:flex;justify-content:space-around;align-items:center;
}
.bottom-nav .item{text-align:center;font-size:11px;color:#9ca3af;}
.bottom-nav .item.active{color:#facc15;}
.bottom-nav .center-btn{
  position:relative;top:-28px;width:68px;height:68px;border-radius:50%;
  background:linear-gradient(135deg,#facc15,#f59e0b);
  display:flex;align-items:center;justify-content:center;
}
</style>
</head>
<body>

<div class="app">

<div class="header">
  <h2>Wallet</h2>
  <i class="fa-solid fa-user" onclick="location.href='profile.html'"></i>
</div>

<div class="balances">
  <div class="balance-box"><span>Total</span><h3 id="balance">0</h3></div>
  <div class="balance-box"><span>Available</span><h3 id="availableBalance">0</h3></div>
  <div class="balance-box"><span>Locked</span><h3 id="lockedBalance">0</h3></div>
</div>

<div class="card">
  <strong>Deposit</strong>
  <div id="depositAddress" style="margin-top:10px;font-size:12px;word-break:break-all;">Not assigned</div>
  <button class="copy-btn" onclick="copyAddress()">Copy Address</button>
</div>

<div class="card">
  <strong>Withdraw</strong>
  <input class="input" id="withdrawAmount" placeholder="Enter amount">
  <button class="btn" onclick="requestWithdraw()">Request Withdraw</button>
</div>

</div>

<div class="bottom-nav">
  <div class="item" onclick="location.href='home.html'">Home</div>
  <div class="item active" onclick="location.href='wallet.html'">Wallet</div>
  <div class="center-btn" onclick="location.href='mining.html'"><i class="fa-solid fa-microchip"></i></div>
  <div class="item" onclick="location.href='stats.html'">Stats</div>
  <div class="item" onclick="location.href='profile.html'">Profile</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDGo2POhmLnPrAwzh1Bq1VgXvYoVSmQiHU",
  authDomain: "z4-miner.firebaseapp.com",
  projectId: "z4-miner",
  storageBucket: "z4-miner.firebasestorage.app",
  messagingSenderId: "31334000454",
  appId: "1:31334000454:web:3f61ded1c258eed5c46747"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser=null;

auth.onAuthStateChanged(user=>{
  if(!user) location.href="login.html";
  else{ currentUser=user; loadWallet(); }
});

function loadWallet(){
  db.collection("users").doc(currentUser.uid).get().then(doc=>{
    const d=doc.data();
    balance.innerText=d.balance||0;
    availableBalance.innerText=d.availableBalance||0;
    lockedBalance.innerText=d.lockedBalance||0;
    depositAddress.innerText=d.depositAddress || "Not assigned";
  });
}

function copyAddress(){
  navigator.clipboard.writeText(depositAddress.innerText);
  alert("Address copied");
}

function requestWithdraw(){
  const amount=parseFloat(withdrawAmount.value);
  if(!amount || amount<=0){ alert("Enter valid amount"); return; }

  alert("Withdraw request sent (demo)");
  withdrawAmount.value="";
}
</script>

</body>
</html>
