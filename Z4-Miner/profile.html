<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Z4 Miner - Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:radial-gradient(circle at top,#0f172a,#020617);color:#fff;}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:120px;}

.header{padding:18px;display:flex;justify-content:space-between;align-items:center;}
.header h2{font-weight:800;}

.user-card{
  margin:0 16px;
  background:linear-gradient(135deg,#111827,#020617);
  border-radius:22px;padding:16px;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.7);
}
.avatar{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#38bdf8,#facc15);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#000;font-size:22px;
}
.badge{
  background:#22c55e;color:#000;
  font-size:10px;padding:2px 8px;border-radius:999px;margin-left:6px;
}
.user-info strong{font-size:17px;}
.user-info div{font-size:12px;opacity:.7;}

.big-balance{
  margin:16px;background:linear-gradient(135deg,#020617,#111827);
  border-radius:24px;padding:22px;text-align:center;
}
.big-balance span{font-size:13px;opacity:.7;}
.big-balance h1{margin-top:6px;font-size:34px;color:#facc15;}

.mini-stats{
  margin:0 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;
}
.mini{
  background:linear-gradient(135deg,#0b1220,#020617);
  border-radius:18px;padding:14px;text-align:center;
}
.mini span{font-size:11px;opacity:.7;}
.mini h3{margin-top:6px;color:#38bdf8;}

.card{
  margin:16px;background:linear-gradient(135deg,#0b1220,#020617);
  border-radius:22px;padding:16px;
}

.progress{
  width:100%;height:8px;background:#020617;border-radius:999px;overflow:hidden;margin-top:8px;
}
.progress div{
  height:100%;width:30%;
  background:linear-gradient(90deg,#38bdf8,#facc15);
}

.copy-btn{
  margin-top:8px;
  background:#020617;border:none;color:#facc15;
  padding:6px 12px;border-radius:8px;font-size:12px;
}

.team-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px;}
.team-item{background:rgba(255,255,255,0.04);border-radius:14px;padding:12px;text-align:center;font-size:12px;}

.menu{
  margin:0 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;
}
.menu-item{
  background:linear-gradient(135deg,#0b1220,#020617);
  border-radius:18px;padding:14px 8px;text-align:center;font-size:12px;
}
.menu-item i{display:block;font-size:20px;margin-bottom:6px;color:#facc15;}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:80px;
  background:linear-gradient(180deg,#0b1220,#020617);
  display:flex;justify-content:space-around;align-items:center;
}
.bottom-nav .item{text-align:center;font-size:11px;color:#9ca3af;}
.bottom-nav .item.active{color:#facc15;}
.bottom-nav .center-btn{
  position:relative;top:-28px;width:68px;height:68px;border-radius:50%;
  background:linear-gradient(135deg,#facc15,#f59e0b);
  display:flex;align-items:center;justify-content:center;
}

.logout{color:#f87171;}
</style>
</head>
<body>

<div class="app">

<div class="header">
  <h2>Profile</h2>
  <i class="fa-solid fa-right-from-bracket logout" onclick="logout()"></i>
</div>

<div class="user-card">
  <div class="avatar" id="avatar">U</div>
  <div class="user-info">
    <strong id="username">User <span class="badge">ACTIVE</span></strong>
    <div id="phone">-</div>
    <div>Level: <span id="level">0</span></div>
  </div>
</div>

<div class="big-balance">
  <span>Total Balance</span>
  <h1 id="balance">0</h1>
</div>

<div class="mini-stats">
  <div class="mini"><span>Available</span><h3 id="availableBalance">0</h3></div>
  <div class="mini"><span>Locked</span><h3 id="lockedBalance">0</h3></div>
  <div class="mini"><span>Today</span><h3 id="dailyProfit">0</h3></div>
</div>

<div class="card">
  <strong>Level Progress</strong>
  <div class="progress"><div id="levelBar"></div></div>
</div>

<div class="card">
  <strong>Current Plan</strong>
  <div>Level: <b id="planLevel">0</b></div>
  <div>Daily Rate: <b id="dailyRate">0</b>%</div>
</div>

<div class="card">
  <strong>Deposit Address</strong>
  <div id="depositAddress" style="font-size:12px;word-break:break-all;">Not assigned</div>
  <button class="copy-btn" onclick="copyText('depositAddress')">Copy</button>
</div>

<div class="card">
  <strong>Team</strong>
  <div class="team-grid">
    <div class="team-item">Members<br><b id="teamSize">0</b></div>
    <div class="team-item">Today<br><b id="teamDailyProfit">0</b></div>
    <div class="team-item">Total<br><b id="teamTotalProfit">0</b></div>
  </div>
</div>

<div class="menu">
  <div class="menu-item"><i class="fa-solid fa-wallet"></i>Wallet</div>
  <div class="menu-item"><i class="fa-solid fa-chart-line"></i>Stats</div>
  <div class="menu-item"><i class="fa-solid fa-star"></i>Plans</div>
</div>

</div>
<div class="bottom-nav">
  <div class="item" onclick="location.href='home.html'">
    <i class="fa-solid fa-house"></i>
    Home
  </div>

  <div class="item" onclick="location.href='wallet.html'">
    <i class="fa-solid fa-wallet"></i>
    Wallet
  </div>

  <div class="center-btn" onclick="location.href='mining.html'">
    <i class="fa-solid fa-microchip"></i>
  </div>

  <div class="item" onclick="location.href='stats.html'">
    <i class="fa-solid fa-chart-line"></i>
    Stats
  </div>

  <div class="item active" onclick="location.href='profile.html'">
    <i class="fa-solid fa-user"></i>
    Profile
  </div>
</div>


<script>
const firebaseConfig = {
  apiKey: "AIzaSyDGo2POhmLnPrAwzh1Bq1VgXvYoVSmQiHU",
  authDomain: "z4-miner.firebaseapp.com",
  projectId: "z4-miner",
  storageBucket: "z4-miner.firebasestorage.app",
  messagingSenderId: "31334000454",
  appId: "1:31334000454:web:3f61ded1c258eed5c46747"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user=>{
  if(!user) location.href="login.html";
  else loadProfile(user.uid);
});

function loadProfile(uid){
  db.collection("users").doc(uid).get().then(doc=>{
    const d = doc.data();
    username.innerText = d.username;
    phone.innerText = d.phone;
    level.innerText = d.level || 0;
    planLevel.innerText = d.level || 0;
    dailyRate.innerText = d.dailyRate || 0;
    balance.innerText = d.balance || 0;
    availableBalance.innerText = d.availableBalance || 0;
    lockedBalance.innerText = d.lockedBalance || 0;
    dailyProfit.innerText = d.dailyProfit || 0;
    teamSize.innerText = d.teamSize || 0;
    teamDailyProfit.innerText = d.teamDailyProfit || 0;
    teamTotalProfit.innerText = d.teamTotalProfit || 0;
    depositAddress.innerText = d.depositAddress || "Not assigned";
    avatar.innerText = d.username[0].toUpperCase();

    // fake progress for now
    levelBar.style.width = Math.min((d.level||0) * 10, 100) + "%";
  });
}

function copyText(id){
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text);
  alert("Copied!");
}

function logout(){
  auth.signOut().then(()=>location.href="login.html");
}
</script>

</body>
</html>
